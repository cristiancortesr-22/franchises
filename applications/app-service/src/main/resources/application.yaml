server:
  port: 8080
spring:
  application:
    name: "franchises"
  devtools:
    add-properties: false
  webflux:
    base-path: api/v1
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

infrastructure:
  db:
    postgres:
      host: "${DB_HOST:localhost}"
      port: "${DB_PORT:5432}"
      database: "${DB_DATABASE:technical_test}"
      username: "${DB_USERNAME:postgres}"
      password: "${DB_PASSWORD:1234}"
      driver: "${DB_DRIVER:postgresql}"
      pool:
        initial-size: "${DB_POOL_INITIAL_SIZE:5}"
        max-size: "${DB_POOL_MAX_SIZE:10}"
        max-idle-time: "${DB_POOL_MAX_IDLE_TIME:30}"
